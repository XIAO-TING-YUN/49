<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>49_xiaotingyun</title>
    <meta name="description" content="上記サンプルにある、黒い帯と白い帯のヘッダーをそれぞれgridで作成せよ">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: whitesmoke;   
        }

        #header_b {   
            list-style: none;
            color: #ffffff;
            display: grid;
            grid-template-columns: 1fr auto auto auto auto auto;
            gap: 20px;
            justify-content: end;
            align-content: center;
            height: 45px;
            padding-right: 1vw;
            background-color: black;
            margin: 0;   
        }
        #header_w {
            list-style: none;
            display: grid;
            grid-template-columns: minmax(40px, 90%) repeat(auto-fit, minmax(70px, auto));
            grid-auto-flow: column;
            align-items: center;
            max-width: 100%;
            height: 45px;
            color: black;
            background-color: #ffffff;
            padding-right: 1vw;
            gap: 20px;
            margin: 0;  
        }
        .bolder {
            font-weight: bolder;
        }
    </style>
</head>
<body>   
    <ul id="header_b">
        <li></li>
        <li>オーナーズサポート</li>
        <li>リフォーム</li>
        <li>オプション工事</li>
        <li>太陽光発電</li>
        <li>よくある質問</li>
    </ul>
    
    <ul id="header_w">
        <li class="bolder">太陽光発電</li>
        <li>選ばれる理由</li>
        <li>導入シミュレーション</li>
        <li>メリット</li>
        <li>ポイント</li>
        <li>マンガで学ぶ</li>
    </ul>
    </body>
</html>
